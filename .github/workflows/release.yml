name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Check target and release version
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "$TARGET"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
          mkdir release-output
      - name: Build and test macOS
        if: runner.os == 'macOS'
        run: |
          npm ci
          npm run test:native
          npm run verify:vendor
          npm run typecheck
          npm run build:native
          npm test
          npm run package:release -- "$PWD/release-output"
      - name: Verify relocated macOS archive
        if: runner.os == 'macOS'
        run: |
          mkdir relocated
          tar -xzf release-output/*.tar.gz -C relocated
          package="$PWD/relocated/mipmux-$(node -p 'require("./package.json").version')-darwin-arm64"
          node "$package/verify-release.mjs" "$package" "$PWD/release-evidence"
          codesign --verify --strict "$package/libexec/darwin-arm64/MipmuxBridge"
      - name: Build and test Linux
        if: runner.os == 'Linux'
        run: |
          docker build -f test/linux/Dockerfile -t mipmux-release .
          docker run --rm mipmux-release
          docker run --rm -v "$PWD/release-output:/release" mipmux-release +            sh -ec 'node scripts/package-release.mjs /release; chmod -R a+rX /release'
      - name: Verify Linux archive without Swift or network access
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir relocated release-evidence
          tar -xzf release-output/*.tar.gz -C relocated
          package="mipmux-$(node -p 'require("./package.json").version')-$TARGET"
          docker run --rm --network none +            -v "$PWD/relocated/$package:/opt/mipmux:ro" +            -v "$PWD/release-evidence:/evidence" +            node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da +            sh -ec '! command -v swift; node /opt/mipmux/verify-release.mjs /opt/mipmux /evidence/smoke; chmod -R a+rX /evidence'
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mipmux-release-assets-${{ matrix.target }}
          path: |
            release-output/*.tar.gz
            release-output/*.sha256
            release-output/*.inventory.json
          if-no-files-found: error
      - name: Upload verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mipmux-release-evidence-${{ matrix.target }}
          path: release-evidence/
          if-no-files-found: error

  draft:
    name: Attest and create draft
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mipmux-release-assets-*
          path: release
          merge-multiple: true
      - name: Check complete release set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          for target in darwin-arm64 linux-x64 linux-arm64; do
            name="mipmux-${TAG#v}-$target"
            test -f "$name.tar.gz"
            test -f "$name.inventory.json"
            sha256sum --check "$name.sha256"
          done
      - name: Attest archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--draft --verify-tag --title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release/*.tar.gz release/*.sha256 release/*.inventory.json "${args[@]}"
