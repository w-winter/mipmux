name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 (Node 22.22.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image builds the native helper, then runs verify:vendor, the type check and the test suite.
      - name: Build the validation image
        run: docker build -f test/linux/Dockerfile -t mipmux-validation .
      - name: Validate
        run: docker run --rm mipmux-validation

  macos:
    name: macOS arm64 (Node 24.22.1)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version
          git --version
      - name: Install dependencies
        run: npm ci
      - name: Native tests
        run: npm run test:native
      - name: Source history
        run: npm run verify:vendor
      - name: Type check
        run: npm run typecheck
      - name: Release native build
        run: npm run build:native
      - name: Test suite
        run: npm test
      - name: Pi extension
        working-directory: integrations/pi
        run: |
          npm run typecheck
          npm test
